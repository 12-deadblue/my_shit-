version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile_inline: |
        FROM python:3.12-slim
        ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 FLASK_ENV=production
        WORKDIR /app
        RUN apt-get update && apt-get install -y --no-install-recommends gcc && rm -rf /var/lib/apt/lists/*
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        EXPOSE 5000
        CMD ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "3", "app:create_app()"]
    container_name: extension_backend
    ports:
      - "5000:5000"
    environment:
      # This points the backend to the Redis container named 'redis'
      - REDIS_URL=redis://redis:6379/0
    env_file:
      # Inject secret variables from the backend's .env file
      - ./backend/.env
    volumes:
      # Persist SQLite database on the host machine
      - ./backend/data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: extension_redis
    ports:
      - "6379:6379"
    volumes:
      # Persist Redis cache in a docker-managed volume
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning

volumes:
  redis_data:
