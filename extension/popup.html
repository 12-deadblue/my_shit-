<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Extension</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>My Custom Extension</h1>
    <p>Built by me, no subscription required! 💪</p>
    
    <div class="user-profile" id="userProfile" style="display: none;">
      <div class="user-info">
        <img id="userAvatar" src="" alt="Avatar" class="avatar">
        <span id="userName" class="user-name"></span>
      </div>
      <button id="logoutBtn" class="sm-btn">Logout</button>
    </div>
    
    <div class="section" id="authSection">
      <h2>Welcome</h2>
      <button id="loginBtn" class="primary-btn">Login with Google</button>
    </div>
    
    <div class="section" id="actionsSection" style="display: none;">
      <h2>Quick Actions</h2>
      <button id="highlightBtn">Highlight Text</button>
      <button id="saveBtn">Save Current Page</button>
      <button id="clearBtn">Clear Data</button>
    </div>
    
    <div class="section">
      <h2>Saved Items</h2>
      <div id="savedList"></div>
    </div>
    
    <div class="footer">
      <small>Free forever ✨</small>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
